{% extends 'base.html' %}
{% block content %}
<h1>Students</h1>
<a href="{{ url_for('add_student') }}" class="btn btn-primary mb-2">Add Student</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Grade</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.grade }}</td>
            <td>
                <form action="{{ url_for('delete_student', student_id=student.id) }}" method="post" style="display:inline-block">
                    <button class="btn btn-danger btn-sm" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
